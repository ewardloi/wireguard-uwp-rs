[package]
name = "wireguard-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "WireGuard VPN plugin."

[lib]
crate-type = ["cdylib"]

[dependencies]
boringtun = "0.7.1"
rand = "0.9.0"
win_etw_macros = "0.1"
win_etw_provider = "0.1"
windows-collections = "0.3"
windows-core = "0.62"
wireguard-config = { path = "../config" }

[dependencies.windows]
version = "0.62"
features = [
    "ApplicationModel_Background",
    "ApplicationModel_Core",
    "Foundation_Collections",
    "Networking_Sockets",
    "Networking_Vpn",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_WinRT",
]
